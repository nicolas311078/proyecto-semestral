# 4. FRONTEND (DESPLIEGUE Y BALANCEADOR DE CARGA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovatech-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: 941678413307.dkr.ecr.us-east-1.amazonaws.com/frontend:latest # <--- ID corregido
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: innovatech-frontend-lb
  annotations:
    # Pasaporte al éxito: Esto le ordena a AWS que el balanceador sea PÚBLICO
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer # <--- Esto creará el balanceador físico en AWS automáticamente
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80